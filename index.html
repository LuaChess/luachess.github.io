let to=pt(m.t);await fmGlide(fm,to);if(g!==gid)throw 0;press();await wait(60);click(m.t,true);await wait(120);
if(promoOpen){const qb=document.querySelector('#popts .popt[data-p="'+(meW?'Q':'q')+'"]');if(qb){await wait(200);const r=qb.getBoundingClientRect(),q=[r.left+r.width*(.3+Math.random()*.4),r.top+r.height*(.3+Math.random()*.4)];await fmGlide(fm,q);if(g!==gid)throw 0;await wait(300);press();await wait(60);qb.click();await wait(120);to=q}}
await fmGlide(fm,away(to))}catch(e){}
fakeBusy=false}
function openPanel(){if($('adm'))return;const p=document.createElement('div');p.id='adm';
p.style.cssText='position:fixed;top:12px;left:12px;z-index:99;background:#262421;border:1px solid #3b82f6;border-radius:8px;padding:12px;width:min(200px,calc(100vw - 16px));font:13px system-ui,sans-serif;color:#fff;display:none;flex-direction:column;gap:8px';
const bt='font:inherit;font-weight:600;padding:6px;border:0;border-radius:4px;background:#3d3a37;color:#fff;cursor:pointer',inp='width:100%;box-sizing:border-box;margin-top:3px;padding:5px;background:#3d3a37;color:#fff;border:0;border-radius:4px';
p.innerHTML=`<b style="color:#5a98f8">Admin panel</b><label>Your ELO<input id="aE1" type="number" value="${myElo}" style="${inp}"></label><label>Bot ELO<input id="aE2" type="number" value="${aiElo}" style="${inp}"></label><button data-a="set" style="${bt}">Apply ELO</button><button data-a="auto2" style="${bt}">Autoplay match: ${autoOn?'ON':'OFF'}</button><button data-a="hint" style="${bt}">Best move hint</button><button data-a="auto" style="${bt}">Play best move</button><button data-a="speak" style="${bt}">Speak best move</button><button data-a="fm" style="${bt}">Fake mouse: ${fakeOn?'ON':'OFF'}</button><button data-a="hk" style="${bt}">Hotkeys: ${hkOn?'ON':'OFF'}</button><div id="aHk" style="font-size:11px;color:#a7a6a2;line-height:1.5;display:${hkOn?'block':'none'}">H hint &middot; B play best move &middot; &szlig; speak best move &middot; F fake mouse &middot; W instant win &middot; L instant loss &middot; Shift+R reset ratings &middot; A show/hide admin UI</div><button data-a="win" style="${bt}">Instant win</button><button data-a="lose" style="${bt}">Instant loss</button><button data-a="reset" style="${bt}">Reset ratings</button><button data-a="hide" style="${bt}">Hide admin UI</button><button data-a="x" style="${bt}">Close</button>`;
p.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
if(a==='set'){myElo=Math.max(0,+$('aE1').value||0);aiElo=Math.max(0,+$('aE2').value||0);ratings[mode]=myElo;save();updInfo()}
else if(a==='hint'){if(!over&&!thinking&&S.t===pcol()){const m=bestMove();if(m){arrows=[m.f+'-'+m.t];drawArrows()}}}
else if(a==='auto'){if(!over&&!thinking&&!fakeBusy&&S.t===pcol()){const m=bestMove();if(m){if(fakeOn){const r=e.target.getBoundingClientRect();fakeMove(m,lastMouse||[r.left+r.width/2,r.top+r.height/2])}else play(m)}}}
else if(a==='speak')speakBest();
else if(a==='auto2'){autoOn=!autoOn;autoDue=0;autoBtn();toast(autoOn?'Autoplay on for this match':'Autoplay off')}
else if(a==='fm'){fakeOn=!fakeOn;e.target.textContent='Fake mouse: '+(fakeOn?'ON':'OFF');if(!fakeOn&&$('fm'))$('fm').style.display='none'}
else if(a==='hk')hkSet(!hkOn);
else if(a==='hide'){hideUI(true);toast(hkOn?'Admin UI hidden. Press A to show it again':"Admin UI hidden. Run admin('kingbeat') in the console to show it again")}
else if(a==='win')forceEnd(true);else if(a==='lose')forceEnd(false);else if(a==='reset'){ratings={bullet:100,blitz:100,rapid:100};save();start()}
else if(a==='x'){const r=p.getBoundingClientRect();p.style.display='none';placeB(r.right-46,r.top);b.style.display='flex'}};
const b=document.createElement('button');b.id='admb';b.title='Admin panel';
b.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 4.500-3.300 8-8 9-4.700-1-8-4.500-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>';
const clampB=(x,y)=>[Math.min(Math.max(6,x),innerWidth-52),Math.min(Math.max(6,y),innerHeight-52)];
function placeB(x,y){[x,y]=clampB(x,y);b.style.left=x+'px';b.style.top=y+'px'}
placeB(innerWidth-58,12);
let dg=null;
b.addEventListener('pointerdown',e=>{if(e.button!==0)return;dg={id:e.pointerId,x:e.clientX,y:e.clientY,l:b.offsetLeft,t:b.offsetTop,m:false};b.setPointerCapture(e.pointerId)});
b.addEventListener('pointermove',e=>{if(!dg||e.pointerId!==dg.id)return;const dx=e.clientX-dg.x,dy=e.clientY-dg.y;if(!dg.m&&Math.hypot(dx,dy)<5)return;dg.m=true;placeB(dg.l+dx,dg.t+dy)});
const endB=e=>{if(!dg||e.pointerId!==dg.id)return;const m=dg.m;dg=null;if(m||e.type==='pointercancel')return;
const l=b.offsetLeft,t=b.offsetTop;b.style.display='none';p.style.display='flex';
const w=p.offsetWidth,h=p.offsetHeight;p.style.left=Math.min(Math.max(8,l+46-w),innerWidth-w-8)+'px';p.style.top=Math.min(Math.max(8,t),Math.max(8,innerHeight-h-8))+'px'};
b.addEventListener('pointerup',endB);b.addEventListener('pointercancel',endB);
addEventListener('resize',()=>{if(b.style.display!=='none')placeB(b.offsetLeft,b.offsetTop)});
document.body.appendChild(p);document.body.appendChild(b)}
/* admin hotkeys: enable them in the admin panel, then they work even while the panel is closed */
/* fake mouse: a real click hides it, and it re-appears from the real mouse position */
let lastMouse=null;
addEventListener('pointermove',e=>{if(!e.isTrusted)return;const mv=!lastMouse||Math.hypot(e.clientX-lastMouse[0],e.clientY-lastMouse[1])>2;lastMouse=[e.clientX,e.clientY];if(mv){const f=$('fm');if(f&&f.style.display!=='none'){f.style.display='none';fmPos=null}}},true);
addEventListener('pointerdown',e=>{if(!e.isTrusted)return;lastMouse=[e.clientX,e.clientY];const f=$('fm');if(f)f.style.display='none';fmPos=null},true);
let adminHidden=false;
function hideUI(v){adminHidden=!!v;['adm','admb'].forEach(id=>{const el=$(id);if(el)el.classList.toggle('admhide',adminHidden)})}
let hkOn=false;try{hkOn=localStorage.getItem('chessHotkeys')==='1'}catch(e){}
function hkSet(v){hkOn=!!v;try{localStorage.setItem('chessHotkeys',hkOn?'1':'0')}catch(e){}
const bt=document.querySelector('#adm [data-a="hk"]');if(bt)bt.textContent='Hotkeys: '+(hkOn?'ON':'OFF');
const lg=$('aHk');if(lg)lg.style.display=hkOn?'block':'none';toast('Admin hotkeys '+(hkOn?'enabled':'disabled'))}
function hkAct(k,shift){
if(k==='h'){if(!over&&!thinking&&S.t===pcol()){const m=bestMove();if(m){arrows=[m.f+'-'+m.t];drawArrows()}}}
else if(k==='b'){if(!over&&!thinking&&!fakeBusy&&S.t===pcol()){const m=bestMove();if(m){if(fakeOn){let s=lastMouse;if(!s){const bb=$('admb'),r=bb&&bb.style.display!=='none'?bb.getBoundingClientRect():{left:innerWidth-58,top:12,width:46,height:46};s=[r.left+r.width/2,r.top+r.height/2]}fakeMove(m,s)}else play(m)}}}
else if(k==='ß')speakBest();
else if(k==='f'){fakeOn=!fakeOn;const bt=document.querySelector('#adm [data-a="fm"]');if(bt)bt.textContent='Fake mouse: '+(fakeOn?'ON':'OFF');if(!fakeOn&&$('fm'))$('fm').style.display='none';toast('Fake mouse '+(fakeOn?'ON':'OFF'))}
else if(k==='w'){if(!over)forceEnd(true)}
else if(k==='l'){if(!over)forceEnd(false)}
else if(k==='a'){hideUI(!adminHidden);toast('Admin UI '+(adminHidden?'hidden':'shown'))}
else if(k==='r'&&shift){ratings={bullet:100,blitz:100,rapid:100};save();start();toast('Ratings reset')}}
document.addEventListener('keydown',e=>{if(!hkOn||!$('adm')||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
const t=e.target;if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
const k=e.key.length===1?e.key.toLowerCase():'';if(!k||!'hbfwlraß'.includes(k))return;
if(k==='r'&&!e.shiftKey)return;e.preventDefault();hkAct(k,e.shiftKey)});
window.admin=function(code){if(code!==ADMIN_CODE){console.warn('Access denied');return}isOwner=true;try{localStorage.setItem('chessOwner','1')}catch(e){}openPanel();hideUI(false);return'Access granted'};

let savedRaw=null;try{savedRaw=localStorage.getItem('chessGame')}catch(e){}
start();restoreGame(savedRaw);
/* 404 page (#404) */
const nfEl=document.createElement('div');nfEl.id='nf';document.body.appendChild(nfEl);let nfOpen=false;
const KNOWN_HASH=['','#','#home','#profile','#settings','#404'];
function renderNF(){let sq='';for(let i=0;i<16;i++)sq+=`<i class="${((i>>2)+(i&3))%2?'d':'l'}" style="background:var(--${((i>>2)+(i&3))%2?'dark':'light'})"></i>`;
nfEl.innerHTML=`<div class="nfw"><div class="nf4"><span>4</span><div class="nfk">${pieceHTML('K')}</div><span>4</span></div><div class="nfb">${sq}<div class="nfn"><div>${pieceHTML('N')}</div></div></div><div class="nft">Checkmate. This page doesn't exist.</div><p class="nfs">The link you followed leads to an empty square. The knight is still looking for it.</p><div class="hbtns" style="justify-content:center"><button class="hb" data-nav="home">Back to home</button><button class="hb o" data-nav="play">Play now</button></div></div>`}
function openNF(){if(setOpen)closeSet();if(homeOpen)closeHome();if(profOpen)closeProfile();renderNF();nfOpen=true;nfEl.style.display='block';nfEl.scrollTop=0;try{if(location.hash!=='#404')history.replaceState(null,'',location.pathname+location.search+'#404')}catch(e){}navSync()}
function closeNF(){nfOpen=false;nfEl.style.display='none';try{if(location.hash==='#404')history.replaceState(null,'',location.pathname+location.search)}catch(e){}navSync()}
window.addEventListener('hashchange',()=>{const h=location.hash;if(h==='#404'||!(KNOWN_HASH.includes(h)||REV.test(h)))openNF();else if(nfOpen)closeNF()});
/* sidebar + home */
let homeOpen=false;const homeEl=$('home');
function navSync(){const k=homeOpen?'home':profOpen?'profile':setOpen?'settings':nfOpen?'':'play';document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===k));const sc=$('sp');if(sc)sc.classList.toggle('on',k==='profile')}
function openHome(){if(setOpen)closeSet();if(profOpen)closeProfile();if(nfOpen)closeNF();renderHome();homeOpen=true;homeEl.style.display='block';homeEl.scrollTop=0;try{if(location.hash!=='#home')location.hash='home'}catch(e){}navSync()}
function closeHome(){homeOpen=false;homeEl.style.display='none';try{if(location.hash==='#home')history.replaceState(null,'',location.pathname+location.search)}catch(e){}navSync()}
document.addEventListener('click',e=>{const a=e.target.closest&&e.target.closest('[data-nav]');if(!a)return;e.preventDefault();const k=a.dataset.nav;if(k==='home')openHome();else if(k==='profile')openProfile();else if(k==='settings')openSet();else{closeHome();closeProfile();closeSet();closeNF();if(rvOn)rvExit(true)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&homeOpen)closeHome()});
window.addEventListener('hashchange',()=>{if(location.hash==='#home')openHome();else if(homeOpen)closeHome()});

function homeBoard(){const fen='r1bqkb1r/pppp1Qpp/2n2n2/4p3/2B1P3/8/PPPP1PPP/RNB1K1NR';let h='',i=0;const sq=p=>{const r=i>>3,c=i&7;h+=`<div class="${(r+c)%2?'d':'l'}" style="background:${(r+c)%2?'var(--dark)':'var(--light)'}">${i===4?'<i></i>':''}${p?pieceHTML(p):''}</div>`;i++};for(const ch of fen){if(ch==='/')continue;if(ch>='1'&&ch<='8')for(let n=0;n<+ch;n++)sq('');else sq(ch)}return h}
function renderHome(){const best=Math.max(...Object.values(ratings)),cur=RANKS.find(x=>best>=x[0]);
const badge=r=>r?`<span class="rk" style="background:${r[2]};border-color:${r[3]}">${r[1]}</span>`:'';
const modes=Object.keys(MODES).map(k=>`<button class="tm${k===mode?' on':''}" data-mode="${k}"><span class="tt">${MODES[k].t/60} min</span><span class="tn">${MODES[k].n}</span><span class="tr">${ratings[k]} ELO ${badge(RANKS.find(x=>ratings[k]>=x[0]))}</span></button>`).join('');
const lad=RANKS.slice().reverse().map(r=>`<div class="lr${cur&&cur===r?' on':''}">${badge(r)}<span class="t">${r[0]}+ ELO</span></div>`).join('');
const anim=MATES.map(([k,n,d])=>`<div class="mo${cfg.mate===k?' on':''}" data-m="${k}"><div class="stg"><div class="kk">${pieceHTML('k')}</div></div><span>${n}</span><small>${d}</small></div>`).join('');
homeEl.innerHTML=`<div class="hw"><div class="hero"><div><div class="hk">Free and open source</div><h1>Play chess. Skip the rest.</h1><p>LuaChess is a chess game that runs in your browser. Pick a time control, take on a bot matched to your rating, and climb from Knight to King.</p><div class="hbtns"><button class="hb" data-act="play">Play now</button><a class="hb o" href="https://github.com/LuaChess/luachess.github.io" target="_blank" rel="noopener">View the source</a></div></div><div class="hbd">${homeBoard()}</div></div>
<div class="hs"><h2>Pick a time control</h2><p class="sub">Each mode keeps its own rating. Choose one to start a game.</p><div class="tc">${modes}</div></div>
<div class="hs"><h2>Climb the ranks</h2><p class="sub">Ratings start at 100. Win games to raise yours, and reach 800 to earn your first rank. The bot is matched to your rating, so every game stays a fair fight.</p><div class="lad">${lad}</div></div>
<div class="hs"><h2>Win in style</h2><p class="sub">Choose how a beaten king goes down. Hover to preview and click to pick. The same animation plays on your own king if you resign.</p><div class="pgrid">${anim}</div></div>
<div class="hs"><div class="hf"><div><h3>Private by default</h3><p>Everything runs in your browser and nothing is sent to a server. Your ratings, games and settings are saved on your device only if you accept the notice.</p></div><div><h3>Open source</h3><p>The code is public. Read it, learn from it, or run your own copy. Find the project at <a href="https://github.com/LuaChess/luachess.github.io" target="_blank" rel="noopener">github.com/LuaChess/luachess.github.io</a>.</p></div></div></div>
<div class="hfoot">LuaChess</div></div>`}
function syncHome(){if(nfOpen)renderNF();if(!homeOpen)return;homeEl.querySelectorAll('.mo').forEach(x=>x.classList.toggle('on',x.dataset.m===cfg.mate));const hb=homeEl.querySelector('.hbd');if(hb)hb.innerHTML=homeBoard()}
function playMode(k){closeHome();if(k!==mode&&!(over&&!settled)){mode=k;save();start()}}
homeEl.addEventListener('click',e=>{const t=e.target.closest('[data-act],[data-mode],.mo');if(!t)return;if(t.dataset.act==='play'){closeHome();return}if(t.dataset.mode){playMode(t.dataset.mode);return}cfg.mate=t.dataset.m;saveCfg();homeEl.querySelectorAll('.mo').forEach(x=>x.classList.toggle('on',x===t));const st=t.querySelector('.stg');if(st)stagePlay(st,cfg.mate)});
homeEl.addEventListener('mouseover',e=>{const mo=e.target.closest('.mo');if(!mo||mo.contains(e.relatedTarget))return;const st=mo.querySelector('.stg');if(st)stagePlay(st,mo.dataset.m)});
function sideSync(){const sp=$('sp');if(!sp)return;const r=RANKS.find(x=>myElo>=x[0]),c={win:0,draw:0,loss:0};games.forEach(g=>{if(c[g.r]!==undefined)c[g.r]++});
sp.innerHTML=`<div class="spa img">${$('avI').innerHTML}</div><div class="spi"><div class="spn"><b>${esc(myName)}</b>${r?`<span class="rk" style="background:${r[2]};border-color:${r[3]}">${r[1]}</span>`:''}</div><div class="sps">${MODES[mode].n} · ${myElo} ELO</div><div class="spr"><span style="color:#81b64c">${c.win}W</span><span>${c.draw}D</span><span style="color:#e0524a">${c.loss}L</span></div></div>`}
try{new MutationObserver(sideSync).observe($('avP').parentElement,{childList:true,subtree:true,characterData:true});new MutationObserver(sideSync).observe($('ov'),{attributes:true,attributeFilter:['style']})}catch(e){}
sideSync();
navSync();
let seenBefore=false;try{seenBefore=localStorage.getItem('chessConsent')==='1'||sessionStorage.getItem('chessSeen')==='1';sessionStorage.setItem('chessSeen','1')}catch(e){}
if(location.hash==='#home'||(!seenBefore&&!location.hash))openHome();
if(location.hash==='#profile')openProfile();
if(location.hash==='#settings')openSet();
{const rm=location.hash.match(REV);if(rm){if(!rvOpenId(+rm[1]))openNF()}else if(location.hash==='#404'||!KNOWN_HASH.includes(location.hash))openNF()}
</script></body></html>
