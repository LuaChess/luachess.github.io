<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess</title>
<style>
:root{--frame:#5d4037;--light:#f0d9b5;--dark:#b58863;--bs:min(94vw,calc(100vh - 170px),700px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:#302e2b;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#col{width:var(--bs);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px;height:44px}
.av{width:40px;height:40px;border-radius:4px;background:#4b4847;flex:none;padding:3px;box-sizing:border-box}
.av svg{width:100%;height:100%;display:block}
.who{display:flex;flex-direction:column;justify-content:center;min-width:0;flex:1;gap:2px}
.line{display:flex;align-items:baseline;gap:6px;font-size:15px}
.line b{font-weight:700}
.elo{color:#a7a6a2;font-size:13px}
#avP{position:relative;padding:0;cursor:pointer;overflow:hidden}
#avI{width:100%;height:100%;padding:3px;box-sizing:border-box}
#avI.img{padding:0}
#avI img{width:100%;height:100%;object-fit:cover;display:block}
.ov2{position:absolute;inset:0;pointer-events:none;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
#avP:hover .ov2{opacity:1}
.ov2 svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pen{background:none;border:0;padding:0;cursor:pointer;color:#a7a6a2;display:flex;align-self:center}
.pen:hover{color:#fff}
.rk{align-self:center;font-size:11px;font-weight:800;line-height:1.3;color:#fff;padding:0 5px;border-radius:3px;border:1px solid;letter-spacing:.02em}
.rk:empty{display:none}
#tabs{display:flex;gap:2px}
#tabs a{font-size:12px;font-weight:600;color:#a7a6a2;padding:4px 7px;border-radius:4px;cursor:pointer}
#tabs a:hover{color:#fff}
#tabs a.on{background:#3d3a37;color:#fff}
.clk{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;background:#262421;color:#a7a6a2;padding:5px 10px;border-radius:4px;min-width:54px;text-align:right;box-sizing:border-box}
.clk.on{background:#fff;color:#262421}
.clk.low{color:#e0524a}
#nameP{cursor:pointer}#nameP:hover{text-decoration:underline}
#fm{position:fixed;left:0;top:0;z-index:100;pointer-events:none;display:none;will-change:transform}
#fm svg{width:24px;height:24px;display:block;transition:transform .1s}
#fm .a{margin:-2px 0 0 -3px}
#fm .h{display:none;margin:-3px 0 0 -10px}
#fm.hand .a{display:none}
#fm.hand .h{display:block}
#fm.press svg{transform:scale(.8)}
#fm i{position:absolute;left:-14px;top:-14px;width:28px;height:28px;border-radius:50%;border:2px solid #fff;opacity:0}
#fm.press i{animation:ring .35s ease-out}
@keyframes ring{from{opacity:.9;transform:scale(.2)}to{opacity:0;transform:scale(1.2)}}
#prof{position:fixed;inset:0;z-index:60;background:#302e2b;overflow-y:auto;display:none}
.pw{width:min(94vw,640px);margin:0 auto;padding:20px 0 40px;box-sizing:border-box}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.back{background:none;border:0;color:#a7a6a2;cursor:pointer;padding:4px;display:flex}
.back:hover{color:#fff}
.back svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pav2{width:64px;height:64px;border-radius:6px;background:#4b4847;overflow:hidden;flex:none;padding:5px;box-sizing:border-box}
.pav2 svg,.pav2 img{width:100%;height:100%;display:block;object-fit:cover}
.pav2:has(img){padding:0}
.pnm{font-size:22px;font-weight:700;display:flex;align-items:center;gap:8px}
.psn{font-size:13px;color:#a7a6a2;margin-top:2px}
.rt,.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.rc,.sc{background:#262421;border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.rl{font-size:12px;color:#a7a6a2;font-weight:600}
.rv{font-size:26px;font-weight:700}
.sc{flex-direction:row;align-items:center;gap:10px}
.sc div{display:flex;flex-direction:column}
.sc b{font-size:20px}.sc span{font-size:12px;color:#a7a6a2}
.pw svg.ic{width:28px;height:28px;flex:none;display:block}
.gh{font-weight:700;margin:18px 0 8px}
.gl{display:flex;flex-direction:column;gap:2px}
.gr{background:#262421;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:4px}
.gm{flex:1;min-width:0;font-size:14px}
.gs{font-size:12px;color:#a7a6a2;margin-top:2px}
.gd{text-align:right;font-size:14px}
.ge{color:#a7a6a2;padding:16px;text-align:center;background:#262421;border-radius:4px}
.pen svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nm{font:inherit;font-weight:700;background:#262421;color:#fff;border:1px solid #81b64c;border-radius:3px;padding:0 4px;width:110px;outline:none}
.caps{display:flex;align-items:center;height:18px;color:#a7a6a2;font-size:13px;font-weight:600}
.cpc{display:block;width:18px;height:18px;margin-right:-6px;flex:none}
.cpc svg{width:100%;height:100%;display:block}
.adv{margin-left:12px}
.rnd,#rs{color:#a7a6a2;font-size:13px;text-decoration:none;cursor:pointer}
#rs:hover{color:#fff}
#wrap{position:relative;width:100%;border:6px solid var(--frame);box-sizing:border-box;border-radius:3px}
#board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:100%;aspect-ratio:1}
#pcs{position:absolute;inset:0;pointer-events:none;z-index:1}
#arr{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.sq{position:relative;cursor:pointer;display:flex;align-items:center;justify-content:center}
.sq.l{background-color:var(--light)}.sq.d{background-color:var(--dark)}
.sq.last{background-image:linear-gradient(rgba(255,235,59,.4),rgba(255,235,59,.4))}
.sq.sel{background-image:linear-gradient(rgba(80,200,120,.5),rgba(80,200,120,.5))}
.sq.chk{background-image:radial-gradient(circle,rgba(255,0,0,.95) 0,rgba(231,0,0,.55) 45%,rgba(169,0,0,0) 78%)}
.sq.mv::after{content:"";width:28%;height:28%;border-radius:50%;background:rgba(0,0,0,.25)}
.sq.cp::after{width:86%;height:86%;background:none;border:6px solid rgba(0,0,0,.25);box-sizing:border-box}
.pc{position:absolute;left:0;top:0;width:12.5%;height:12.5%;transition:transform .2s cubic-bezier(.3,.7,.3,1),opacity .18s;animation:in .35s both}
.pc svg{width:100%;height:100%;display:block;transition:transform .18s}
.pc.gone{opacity:0}.pc.gone svg{transform:scale(.4)}
.pc.pop svg{animation:pop .3s}
.pc.dead svg{animation:fall 1.1s forwards}
@keyframes in{from{opacity:0}to{opacity:1}}
@keyframes pop{50%{transform:scale(1.4)}}
@keyframes fall{25%{transform:rotate(-12deg) scale(1.15)}100%{transform:rotate(90deg) translateX(12%) scale(.9)}}
@keyframes shake{20%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
@keyframes flash{0%,100%{border-color:var(--frame)}35%{border-color:#c33}}
@keyframes pup{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
#wrap.mate{animation:shake .5s,flash 1.4s}
#ov{position:fixed;inset:0;z-index:50;background:rgba(38,36,33,.72);display:none;align-items:center;justify-content:center}
.card{background:#262421;border-radius:8px;padding:24px 32px 28px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;animation:pup .3s both;width:min(88vw,420px);box-sizing:border-box}
.vs{display:flex;align-items:flex-start;justify-content:center;gap:18px;margin:16px 0 22px;width:100%}
.pl{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;min-width:0}
.pav{width:76px;height:76px;border-radius:6px;background:#4b4847;padding:6px;box-sizing:border-box;overflow:hidden}
.pav.img{padding:0}
.pav svg{width:100%;height:100%;display:block}
.pav img{width:100%;height:100%;object-fit:cover;display:block}
.pn{font-weight:700;font-size:16px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pe{font-size:14px;color:#a7a6a2}
.pe .d{font-weight:700;margin-left:4px}
.vsx{color:#a7a6a2;font-weight:700;align-self:center;margin-top:-30px}
#msg{font-size:clamp(20px,4.5vmin,30px);font-weight:700}
#sub{font-size:14px;color:#a7a6a2}
#next{font:inherit;font-weight:700;font-size:16px;padding:10px 28px;border:0;border-radius:6px;background:#81b64c;color:#fff;cursor:pointer}
#next:hover{background:#95c15f}
</style></head><body>

if(S.b[i]&&isW(S.b[i])){sel=i;legalSel=legal(S).filter(m=>m.f===i)}else{sel=null;legalSel=[]}
paint()}
function play(m){const g=gid;thinking=true;sel=null;legalSel=[];doMove(m,()=>setTimeout(()=>{if(over||g!==gid)return;const a=aiMove();doMove(a,()=>{if(g===gid)thinking=false})},MODES[mode].d[0]+Math.random()*(MODES[mode].d[1]-MODES[mode].d[0])))}
function doMove(m,done){const w=S.t==='w',el=els[m.f],cs=m.ep?m.t+(w?8:-8):m.t,cap=!!S.b[cs];
if(cap&&els[cs]){caps[w?'w':'b'].push(S.b[cs]);const c=els[cs];els[cs]=null;c.classList.add('gone');setTimeout(()=>c.remove(),220)}
els[m.f]=null;els[m.t]=el;el.style.zIndex=++z;place(el,m.t);
if(m.castle){const row=w?7:0,rf=row*8+(m.castle===1?7:0),rt=row*8+(m.castle===1?5:3);els[rt]=els[rf];els[rf]=null;place(els[rt],rt)}
if(m.p){const e=el;setTimeout(()=>{e.innerHTML=pieceHTML(m.p);e.classList.add('pop')},180)}
S=apply(S,m);hist.push(posKey(S));if(w&&!started){started=true;lastTick=Date.now()}last={f:m.f,t:m.t};arrows=[];drawArrows();paint();updInfo();
const ms=legal(S),chk=inCheck(S,S.t==='w');
const dr=ms.length?drawReason():'';if(!ms.length||dr)over=true;
setTimeout(()=>{
if(!ms.length){if(chk){snd.mate();const k=els[kingSq(S.b,S.t==='w')];if(k)k.classList.add('dead');wrap.classList.add('mate')}else snd.move();setTimeout(()=>endGame(chk?(S.t==='b'?'win':'loss'):'draw',chk?'by checkmate':'by stalemate'),chk?1500:500)}
else if(dr){snd.move();setTimeout(()=>endGame('draw',dr),500)}
else{chk?snd.check():m.castle?snd.castle():cap?snd.cap():snd.move();done&&done()}},190)}
function endGame(res,why){if(settled)return;settled=true;over=true;thinking=true;
const E=1/(1+Math.pow(10,(aiElo-myElo)/400)),sc=res==='win'?1:res==='draw'?.5:0,old=myElo;
myElo=Math.max(100,old+Math.round(32*(sc-E)));const d=myElo-old;ratings[mode]=myElo;save();recordGame(res,why,d);
let t,c;if(res==='win'){t='You won';c='#81b64c'}else if(res==='loss'){t='You lost';c='#e0524a'}else{t='Draw';c='#fff'}
const m=$('msg');m.textContent=t;m.style.color=c;$('sub').textContent=why;
$('ovP').className='pav'+(myPic?' img':'');$('ovP').innerHTML=$('avI').innerHTML;$('ovPn').textContent=myName;
$('ovA').innerHTML=$('avA').innerHTML;
const dc=d>0?'#81b64c':d<0?'#e0524a':'#a7a6a2';
$('ovPe').innerHTML=`${old} \u2192 ${myElo}<span class="d" style="color:${dc}">(${d>0?'+':''}${d})</span>`;
$('ovAe').textContent=aiElo;
ov.style.display='flex';updInfo()}
document.getElementById('next').onclick=start;
function start(){gid++;S=newState();sel=null;legalSel=[];last=null;over=false;thinking=false;settled=false;started=false;hist=[posKey(S)];
myElo=ratings[mode];const lo=Math.max(25,Math.round(myElo*.85)),hi=Math.max(lo+1,Math.round(myElo*1.65));aiElo=lo+Math.floor(Math.random()*(hi-lo+1));
tw=tb=MODES[mode].t*1000;lastTick=Date.now();
ov.style.display='none';wrap.classList.remove('mate');
pcs.innerHTML='';els=[];caps={w:[],b:[]};arrows=[];drawArrows();for(let i=0;i<64;i++)if(S.b[i])els[i]=mk(S.b[i],i);paint();updInfo();showClk()}/* clocks, draw rules */
let gid=0,tw=0,tb=0,started=false,lastTick=0,settled=false,hist=[];
const posKey=s=>s.b.map(x=>x||'.').join('')+s.t+(s.c.K?'K':'')+(s.c.Q?'Q':'')+(s.c.k?'k':'')+(s.c.q?'q':'')+s.ep;
function drawReason(){if(S.hm>=100)return'by 50-move rule';const k=posKey(S);if(hist.filter(x=>x===k).length>=3)return'by repetition';
const p=S.b.filter(x=>x&&x.toLowerCase()!=='k');if(!p.length||(p.length===1&&'nb'.includes(p[0].toLowerCase())))return'by insufficient material';return''}
const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function showClk(){const P=$('clkP'),A=$('clkA');P.textContent=fmt(tw);A.textContent=fmt(tb);
P.classList.toggle('on',started&&!over&&S.t==='w');A.classList.toggle('on',started&&!over&&S.t==='b');P.classList.toggle('low',tw<10000);A.classList.toggle('low',tb<10000)}
setInterval(()=>{const n=Date.now(),dt=n-lastTick;lastTick=n;if(!started||over||profOpen)return;
if(S.t==='w')tw-=dt;else tb-=dt;
if(tw<=0){tw=0;showClk();endGame('loss','on time')}else if(tb<=0){tb=0;showClk();endGame('win','on time')}else showClk()},100);
/* profile page (#profile) */
let games=[];try{games=JSON.parse(localStorage.getItem('chessGames')||'[]')||[]}catch(e){}
let since=0;try{since=+localStorage.getItem('chessSince')||0;if(!since){since=Date.now();localStorage.setItem('chessSince',since)}}catch(e){since=Date.now()}
function recordGame(res,why,d){games.unshift({r:res,m:mode,mv:Math.ceil((hist.length-1)/2),o:aiElo,d,w:why,t:Date.now()});games=games.slice(0,150);try{localStorage.setItem('chessGames',JSON.stringify(games))}catch(e){}}
const sq=(c,p)=>`<svg class="ic" viewBox="0 0 24 24"><rect width="24" height="24" rx="4" fill="${c}"/><path d="${p}" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none"/></svg>`;
const ICO={win:sq('#81b64c','M12 6v12M6 12h12'),loss:sq('#e0524a','M6 12h12'),draw:sq('#8b8987','M6 9h12M6 15h12')};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=t=>new Date(t).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
let profOpen=false;const prof=document.createElement('div');prof.id='prof';document.body.appendChild(prof);
function rkHTML(elo){const r=RANKS.find(x=>elo>=x[0]);return r?`<span class="rk" style="background:${r[2]};border-color:${r[3]}">${r[1]}</span>`:''}
function renderProfile(){const cnt={win:0,loss:0,draw:0};games.forEach(g=>{if(cnt[g.r]!==undefined)cnt[g.r]++});
const lbl={win:'Won',loss:'Lost',draw:'Draw'},col=v=>v>0?'#81b64c':v<0?'#e0524a':'#a7a6a2';
const row=g=>`<div class="gr">${ICO[g.r]||''}<div class="gm"><div><b>${lbl[g.r]||''}</b> vs Bot (${g.o})</div><div class="gs">${MODES[g.m]?MODES[g.m].n:g.m} · in ${g.mv} ${g.mv===1?'move':'moves'} · ${esc(g.w)}</div></div><div class="gd"><b style="color:${col(g.d)}">${g.d>0?'+':''}${g.d}</b><div class="gs">${fd(g.t)}</div></div></div>`;
prof.innerHTML=`<div class="pw"><div class="ph"><button class="back" id="pback" title="Back to game"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button><div class="pav2">${$('avI').innerHTML}</div><div><div class="pnm">${esc(myName)} ${rkHTML(ratings[mode])}</div><div class="psn">Playing since ${fd(since)}</div></div></div>`+
`<div class="rt">${Object.keys(MODES).map(k=>`<div class="rc"><div class="rl">${MODES[k].n}</div><div class="rv">${ratings[k]}</div>${rkHTML(ratings[k])}</div>`).join('')}</div>`+
`<div class="sm">${['win','loss','draw'].map(k=>`<div class="sc">${ICO[k]}<div><b>${cnt[k]}</b><span>${lbl[k]==='Draw'?'Drawn':lbl[k]}</span></div></div>`).join('')}</div>`+
`<div class="gh">Games (${games.length})</div><div class="gl">${games.length?games.map(row).join(''):'<div class="ge">No games yet</div>'}</div></div>`;
$('pback').onclick=closeProfile}
function openProfile(){renderProfile();profOpen=true;prof.style.display='block';prof.scrollTop=0;try{if(location.hash!=='#profile')location.hash='profile'}catch(e){}}
function closeProfile(){profOpen=false;prof.style.display='none';try{if(location.hash==='#profile')history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
document.addEventListener('click',e=>{if(e.target.id==='nameP')openProfile()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&profOpen)closeProfile()});
window.addEventListener('hashchange',()=>{if(location.hash==='#profile')openProfile();else if(profOpen)closeProfile()});
/* admin / cheat panel: type admin('kingbeat') in the browser console */
const ADMIN_CODE='kingbeat';
function bestMove(){let b=null,bs=-1e9;for(const m of legal(S)){const v=-search(apply(S,m),2,-1e9,1e9);if(v>bs){bs=v;b=m}}return b}
function forceEnd(win){endGame(win?'win':'loss','by admin')}
let fakeOn=true,fakeBusy=false,fmPos=null,fmLoop=false;
function getFM(){let fm=$('fm');if(!fm){fm=document.createElement('div');fm.id='fm';
fm.innerHTML='<i></i><svg class="a" viewBox="0 0 24 24"><path d="M3 2l17 8-7 2-3 7z" fill="#fff" stroke="#000" stroke-width="1.5" stroke-linejoin="round"/></svg><svg class="h" viewBox="0 0 24 24"><path d="M9 4.500a1.500 1.500 0 0 1 3 0V11h1V9.500a1.500 1.500 0 0 1 3 0V11h.5v-.5a1.500 1.500 0 0 1 3 0V16c0 3.500-2.500 6-6 6h-1c-2.500 0-4-1-5-3l-2.500-4.500a1.300 1.300 0 0 1 2.200-1.300L9 14z" fill="#fff" stroke="#000" stroke-width="1.3" stroke-linejoin="round"/></svg>';document.body.appendChild(fm)}return fm}
function fmHover(){const fm=$('fm');if(!fm||fm.style.display==='none'||!fmPos){fmLoop=false;return}
const el=document.elementFromPoint(fmPos[0],fmPos[1]);fm.classList.toggle('hand',!!el&&getComputedStyle(el).cursor==='pointer');requestAnimationFrame(fmHover)}
const fmEase=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function fmGlide(fm,to){return new Promise(res=>{const from=fmPos,dx=to[0]-from[0],dy=to[1]-from[1],dist=Math.hypot(dx,dy)||1,dur=Math.min(480,200+dist*.25);
const nx=-dy/dist,ny=dx/dist,off=(Math.random()<.5?-1:1)*dist*(.08+Math.random()*.14),cx=from[0]+dx/2+nx*off,cy=from[1]+dy/2+ny*off,ph=Math.random()*6.28,t0=performance.now();
const step=now=>{const t=Math.min(1,(now-t0)/dur),e=fmEase(t),u=1-e;
let x=u*u*from[0]+2*u*e*cx+e*e*to[0],y=u*u*from[1]+2*u*e*cy+e*e*to[1];
const w=Math.sin(e*Math.PI)*1.6;x+=Math.sin(ph+e*9)*w;y+=Math.cos(ph+e*7)*w;
if(t>=1){x=to[0];y=to[1]}
fmPos=[x,y];fm.style.transform=`translate(${x}px,${y}px)`;
if(t<1)requestAnimationFrame(step);else res()};requestAnimationFrame(step)})}
async function fakeMove(m,start){const g=gid;fakeBusy=true;const fm=getFM();
if(!fmPos)fmPos=start;fm.style.display='block';fm.style.transform=`translate(${fmPos[0]}px,${fmPos[1]}px)`;
if(!fmLoop){fmLoop=true;requestAnimationFrame(fmHover)}
const R=()=>boardEl.getBoundingClientRect(),sz=()=>R().width/8;
const pt=i=>{const r=R(),s=r.width/8;return[r.left+((i&7)+.5)*s+(Math.random()-.5)*s*.4,r.top+((i>>3)+.5)*s+(Math.random()-.5)*s*.4]};
const away=p=>{const r=R();let x,y,n=0;do{x=r.left+Math.random()*r.width;y=r.top+Math.random()*r.height;n++}while(Math.hypot(x-p[0],y-p[1])<r.width*.3&&n<20);return[x,y]};
const press=()=>{fm.classList.remove('press');void fm.offsetWidth;fm.classList.add('press')};
const wait=ms=>new Promise(r=>setTimeout(r,ms));
try{await fmGlide(fm,pt(m.f));if(g!==gid)throw 0;press();await wait(60);click(m.f,true);await wait(90);
const to=pt(m.t);await fmGlide(fm,to);if(g!==gid)throw 0;press();await wait(60);click(m.t,true);await wait(120);
await fmGlide(fm,away(to))}catch(e){}
fakeBusy=false}
function openPanel(){if($('adm'))return;const p=document.createElement('div');p.id='adm';
p.style.cssText='position:fixed;top:12px;right:12px;z-index:99;background:#262421;border:1px solid #81b64c;border-radius:6px;padding:12px;width:190px;font:13px system-ui,sans-serif;color:#fff;display:flex;flex-direction:column;gap:8px';
const bt='font:inherit;font-weight:600;padding:6px;border:0;border-radius:4px;background:#3d3a37;color:#fff;cursor:pointer',inp='width:100%;box-sizing:border-box;margin-top:3px;padding:5px;background:#3d3a37;color:#fff;border:0;border-radius:4px';
p.innerHTML=`<b style="color:#81b64c">Admin panel</b><label>Your ELO<input id="aE1" type="number" value="${myElo}" style="${inp}"></label><label>Bot ELO<input id="aE2" type="number" value="${aiElo}" style="${inp}"></label><button data-a="set" style="${bt}">Apply ELO</button><button data-a="hint" style="${bt}">Best move hint</button><button data-a="auto" style="${bt}">Play best move</button><button data-a="fm" style="${bt}">Fake mouse: ${fakeOn?'ON':'OFF'}</button><button data-a="win" style="${bt}">Instant win</button><button data-a="lose" style="${bt}">Instant loss</button><button data-a="reset" style="${bt}">Reset ratings</button><button data-a="x" style="${bt}">Close</button>`;
p.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
if(a==='set'){myElo=Math.max(0,+$('aE1').value||0);aiElo=Math.max(0,+$('aE2').value||0);ratings[mode]=myElo;save();updInfo()}
else if(a==='hint'){if(!over&&!thinking&&S.t==='w'){const m=bestMove();if(m){arrows=[m.f+'-'+m.t];drawArrows()}}}
else if(a==='auto'){if(!over&&!thinking&&!fakeBusy&&S.t==='w'){const m=bestMove();if(m){if(fakeOn){const r=e.target.getBoundingClientRect();fakeMove(m,[r.left+r.width/2,r.top+r.height/2])}else play(m)}}}
else if(a==='fm'){fakeOn=!fakeOn;e.target.textContent='Fake mouse: '+(fakeOn?'ON':'OFF');if(!fakeOn&&$('fm'))$('fm').style.display='none'}
else if(a==='win')forceEnd(true);else if(a==='lose')forceEnd(false);else if(a==='reset'){ratings={bullet:100,blitz:100,rapid:100};save();start()}
else if(a==='x')p.remove()};
document.body.appendChild(p)}
window.admin=function(code){if(code!==ADMIN_CODE){console.warn('Access denied');return}openPanel();return'Access granted'};

start();
if(location.hash==='#profile')openProfile();
</script></body></html>
